<style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#182443;background:#f4f6fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(130deg,#14295c,#3754a3);color:white;text-align:center;padding:34px 16px 30px}header .brand{font-weight:900;font-size:18px}header h1{font-size:clamp(24px,5vw,35px);margin:14px 0 8px}header p{margin:0;color:#dce5ff}.wrap{max-width:850px;margin:24px auto;padding:0 15px 70px}.panel{background:white;border-radius:18px;padding:22px;box-shadow:0 6px 22px #172c6412;margin-bottom:18px}.bar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.tag{display:inline-block;background:#e8eeff;color:#2949a0;padding:6px 11px;border-radius:50px;font-size:13px;font-weight:800}.muted{color:#69758b;font-size:14px}.progress{height:9px;border-radius:20px;background:#e9edf7;overflow:hidden;margin-top:14px}.progress>div{height:100%;background:#4167d9;transition:width .2s}.question{border:1px solid #e5e9f4;border-radius:15px;padding:19px;margin:15px 0}.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.han{border:0;background:transparent;font-size:34px;font-weight:850;color:#142d73;cursor:pointer;padding:6px 0}.han:hover{text-decoration:underline}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.opt{border:1px solid #dce2ef;background:#fff;border-radius:10px;text-align:left;padding:13px 12px;min-height:53px;cursor:pointer;font-size:15px;color:#26334c;line-height:1.5}.opt.selected{background:#e7eeff;border-color:#4167d9;font-weight:700}.opt:disabled{cursor:default}.opt.correct{background:#e7f7ec;border-color:#43a565}.opt.wrong{background:#fff0ee;border-color:#e3685a}.feedback{margin-top:13px;background:#fff4e8;border-left:4px solid #e6a246;padding:12px;border-radius:6px;line-height:1.7}.btns{display:flex;flex-wrap:wrap;gap:9px}.btn{border:0;border-radius:11px;padding:13px 17px;background:#2949a0;color:white;font-weight:800;font-size:15px;cursor:pointer}.btn.secondary{background:#e8edfa;color:#213d84}.btn:disabled{opacity:.45;cursor:not-allowed}.score{font-size:30px;font-weight:900;color:#233f91;margin:10px 0}.hidden{display:none!important}footer{text-align:center;color:#8791a6;font-size:13px;padding-top:20px}@media(max-width:550px){.options{grid-template-columns:1fr}.panel{padding:16px}.question{padding:15px}.han{font-size:30px}}
</style></head><body>
<header><div class="brand">합격킹 HSK</div><div style="margin-top:7px;font-weight:700">화선쌤 속사포 0-3급</div><h1>HSK 3급 필수단어 [5]</h1><p>한자를 눌러 발음을 듣고 알맞은 뜻을 골라보세요!</p></header>
<main class="wrap"><section class="panel"><div class="bar"><span id="mode" class="tag">전체 어휘 테스트</span><span class="muted" id="count"></span></div><div class="progress"><div id="fill" style="width:0"></div></div><p class="muted">병음은 채점 후 오답에만 표시됩니다. 새로고침하면 새로운 순서로 출제됩니다.</p><div class="btns"><button class="btn secondary" id="previous">이전 결과 다시 보기</button><button class="btn secondary" id="retry">틀린 문제 다시 풀기</button><button class="btn secondary" id="restart">처음부터 다시 풀기</button></div></section><section class="panel hidden" id="summary"></section><section id="questions"></section><div class="panel" id="submitbox"><button class="btn" id="grade" style="width:100%">채점하기</button><p class="muted" style="text-align:center;margin-bottom:0">선택하지 않은 문제는 오답 처리됩니다.</p></div><footer>합격킹 HSK · 화선쌤 속사포 0-3급</footer></main>
<script>
const DATA=[{"id": "w0", "han": "街道", "pinyin": "jiēdào", "meaning": "[명] 거리, 길"}, {"id": "w1", "han": "节目", "pinyin": "jiémù", "meaning": "[명] 프로그램"}, {"id": "w2", "han": "节日", "pinyin": "jiérì", "meaning": "[명] 명절, 기념일"}, {"id": "w3", "han": "解决", "pinyin": "jiějué", "meaning": "[동] 해결하다"}, {"id": "w4", "han": "借", "pinyin": "jiè", "meaning": "[동] 빌리다"}, {"id": "w5", "han": "经过", "pinyin": "jīngguò", "meaning": "[동] 경험하다, 거치다, 겪다"}, {"id": "w6", "han": "久", "pinyin": "jiǔ", "meaning": "[형] (시간이) 오래다, 길다"}, {"id": "w7", "han": "句子", "pinyin": "jùzi", "meaning": "[명] 문장"}, {"id": "w8", "han": "决定", "pinyin": "juédìng", "meaning": "[명/동] 결정(하다)"}, {"id": "w9", "han": "接", "pinyin": "jiē", "meaning": "[동] 받다 / 마중하다"}, {"id": "w10", "han": "咖啡", "pinyin": "kāfēi", "meaning": "[명] 커피"}, {"id": "w11", "han": "咖啡厅", "pinyin": "kāfēitīng", "meaning": "[명] 카페"}, {"id": "w12", "han": "看见", "pinyin": "kànjiàn", "meaning": "[동] 보이다"}, {"id": "w13", "han": "渴", "pinyin": "kě", "meaning": "[형] 목이 마르다"}, {"id": "w14", "han": "空调", "pinyin": "kōngtiáo", "meaning": "[명] 에어컨"}, {"id": "w15", "han": "哭", "pinyin": "kū", "meaning": "[동] 울다"}, {"id": "w16", "han": "筷子", "pinyin": "kuàizi", "meaning": "[명] 젓가락"}, {"id": "w17", "han": "裤子", "pinyin": "kùzi", "meaning": "[명] 바지"}, {"id": "w18", "han": "裙子", "pinyin": "qúnzi", "meaning": "[명] 치마"}, {"id": "w19", "han": "老", "pinyin": "lǎo", "meaning": "[형] 늙다"}, {"id": "w20", "han": "年轻", "pinyin": "niánqīng", "meaning": "[형] 젊다"}, {"id": "w21", "han": "离开", "pinyin": "líkāi", "meaning": "[동] 떠나다, 헤어지다"}, {"id": "w22", "han": "礼物", "pinyin": "lǐwù", "meaning": "[명] 선물"}, {"id": "w23", "han": "脸", "pinyin": "liǎn", "meaning": "[명] 얼굴"}, {"id": "w24", "han": "练习", "pinyin": "liànxí", "meaning": "[동] 연습하다"}, {"id": "w25", "han": "了解", "pinyin": "liǎojiě", "meaning": "[동] 이해하다, 잘 알다"}, {"id": "w26", "han": "楼", "pinyin": "lóu", "meaning": "[명] 건물, 빌딩"}, {"id": "w27", "han": "路", "pinyin": "lù", "meaning": "[명] 길"}, {"id": "w28", "han": "凉快", "pinyin": "liángkuai", "meaning": "[형] 시원하다"}, {"id": "w29", "han": "暖和", "pinyin": "nuǎnhuo", "meaning": "[형] 따뜻하다, 온화하다"}];
const STORE='hsk_3_part5_last_v1';
const byId=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let questions=[],answers={},graded=false,wrong=[],mode='전체 어휘 테스트';
function speak(word){if(!('speechSynthesis'in window)){alert('이 브라우저에서는 음성 읽기를 지원하지 않습니다.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(word);u.lang='zh-CN';u.rate=.78;let voices=speechSynthesis.getVoices();let v=voices.find(v=>v.lang.toLowerCase().startsWith('zh-cn'))||voices.find(v=>v.lang.toLowerCase().startsWith('zh'));if(v)u.voice=v;speechSynthesis.speak(u)}
function choiceList(q){let pool=[...new Set(DATA.filter(x=>x.id!==q.id&&x.meaning!==q.meaning).map(x=>x.meaning))];return shuffle([q.meaning,...shuffle(pool).slice(0,3)])}
function start(items=DATA,label='전체 어휘 테스트'){questions=shuffle(items).map(q=>({...q,choices:choiceList(q)}));answers={};graded=false;wrong=[];mode=label;render();window.scrollTo(0,0)}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){byId('mode').textContent=mode;byId('summary').classList.add('hidden');byId('submitbox').classList.remove('hidden');byId('grade').disabled=false;const root=byId('questions');root.innerHTML='';questions.forEach((q,i)=>{const el=document.createElement('article');el.className='panel question';let opts=q.choices.map((c,j)=>`<button class="opt" data-choice="${j}" type="button">${escapeHTML(c)}</button>`).join('');el.innerHTML=`<div class="qhead"><span class="tag">필수단어 · ${i+1}번</span><span class="muted">🔊 한자 클릭</span></div><button class="han" type="button" title="중국어 발음 듣기">${escapeHTML(q.han)}</button><div class="options">${opts}</div><div class="feedback hidden"></div>`;el.querySelector('.han').addEventListener('click',()=>speak(q.han));el.querySelectorAll('.opt').forEach((b,j)=>b.addEventListener('click',()=>{if(graded)return;answers[q.id]=q.choices[j];el.querySelectorAll('.opt').forEach(n=>n.classList.remove('selected'));b.classList.add('selected');updateProgress()}));root.appendChild(el)});updateProgress();let exists=false;try{exists=!!localStorage.getItem(STORE)}catch(e){}byId('previous').disabled=!exists;byId('retry').disabled=true}
function updateProgress(){let n=questions.filter(q=>answers[q.id]!==undefined).length;byId('count').textContent=`${n} / ${questions.length}문제 선택`;byId('fill').style.width=`${questions.length?100*n/questions.length:0}%`}
function displayGrade(){wrong=[];questions.forEach((q,i)=>{let correct=answers[q.id]===q.meaning;if(!correct)wrong.push(q.id);let el=byId('questions').children[i];el.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(q.choices[j]===q.meaning)b.classList.add('correct');if(q.choices[j]===answers[q.id]&&!correct)b.classList.add('wrong')});if(!correct){let f=el.querySelector('.feedback');f.classList.remove('hidden');f.innerHTML=`<strong>오답 · 정답 확인</strong><div>병음: ${escapeHTML(q.pinyin)}</div><div>뜻: ${escapeHTML(q.meaning)}</div>`}});byId('retry').disabled=wrong.length===0;byId('grade').disabled=true;let correct=questions.length-wrong.length;let s=byId('summary');s.classList.remove('hidden');s.innerHTML=`<div class="tag">채점 결과</div><div class="score">${correct} / ${questions.length}문제 정답 · ${questions.length?Math.round(correct/questions.length*100):0}점</div><p class="muted">틀린 문제 ${wrong.length}개 · 틀린 문제 아래에서 병음과 뜻을 확인하세요.</p>`}
function grade(){if(graded)return;graded=true;displayGrade();let record={ids:questions.map(q=>q.id),choices:questions.map(q=>q.choices),answers:{...answers},mode,at:new Date().toLocaleString('ko-KR')};try{localStorage.setItem(STORE,JSON.stringify(record))}catch(e){}byId('previous').disabled=false;window.scrollTo({top:0,behavior:'smooth'})}
function previous(){let record;try{record=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){}if(!record||!Array.isArray(record.ids)){alert('저장된 이전 결과가 없습니다.');return}let items=record.ids.map(id=>DATA.find(q=>q.id===id)).filter(Boolean);questions=items.map((q,i)=>({...q,choices:Array.isArray(record.choices?.[i])?record.choices[i]:choiceList(q)}));answers=record.answers||{};mode=(record.mode||'전체 어휘 테스트')+' · 이전 결과';graded=false;render();graded=true;displayGrade();byId('submitbox').classList.add('hidden');window.scrollTo(0,0)}
byId('grade').addEventListener('click',grade);byId('restart').addEventListener('click',()=>start());byId('retry').addEventListener('click',()=>{if(!graded||!wrong.length)return;start(DATA.filter(q=>wrong.includes(q.id)),'틀린 문제 다시 풀기')});byId('previous').addEventListener('click',previous);start();
</script></body></html>
